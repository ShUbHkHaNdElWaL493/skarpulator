name: Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'skarpulator_android_client/**' 
  pull_request:
    branches: [ "main" ]
    paths:
      - 'skarpulator_android_client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./skarpulator_android_client

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build and Test
      run: ./gradlew build